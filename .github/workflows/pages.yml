name: Publish browser screening demo

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare static site
        run: |
          mkdir -p site
          cp web/index.html web/app.js site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live Pages HTML and JavaScript
        env:
          LIVE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if curl --fail --location --silent --show-error "$LIVE_URL" -o /tmp/fed-pages.html \
               && grep -q "Local Screening Demo" /tmp/fed-pages.html \
               && curl --fail --location --silent --show-error "${LIVE_URL%/}/app.js" -o /tmp/fed-pages-app.js \
               && grep -q "function evaluateTask" /tmp/fed-pages-app.js; then
              echo "Deployed HTML and JavaScript are accessible"
              exit 0
            fi
            sleep 3
          done
          echo "Pages assets were not accessible after deployment" >&2
          exit 1
